name: freelancebot
description: フリーランス向け請求書アプリ - インボイス制度対応・PDF即生成
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  pdf: ^3.11.1
  printing: ^5.13.4
  intl: ^0.19.0
  google_mobile_ads: ^5.3.1
  in_app_purchase: ^3.2.1
  share_plus: ^10.1.2
  uuid: ^4.5.1
  flutter_riverpod: ^2.6.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.otf
        - asset: assets/fonts/NotoSansJP-Bold.otf
          weight: 700
